name: myNSE200 Telegram Reply Listener

# Runs check_replies.py frequently so your BUY/SKIP replies get picked up
# promptly during the day, not just once at night. Does NOT touch prices,
# fundamentals, or generate new signals — only reads Telegram replies and
# updates the pending/holding tracking. Same as nightly.yml, this file
# only controls scheduling, never the strategy itself.

"on":
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes — GitHub may occasionally
                            # run a little later than exactly on the mark
                            # during busy periods, same as you already saw
                            # with "Queued" runs on your other project
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-replies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new Telegram replies
        env:
          MYNSE200_TG_TOKEN: ${{ secrets.MYNSE200_TG_TOKEN }}
          MYNSE200_TG_CHAT_ID: ${{ secrets.MYNSE200_TG_CHAT_ID }}
        run: python3 check_replies.py

      - name: Save any position changes back to the repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "myNSE200 Automation"
          git add market_data.db 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Reply processed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
